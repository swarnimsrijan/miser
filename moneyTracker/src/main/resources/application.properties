spring.application.name=moneyTracker
# Local secrets and settings live in the gitignored .env (see .env.example).
spring.config.import=optional:file:.env[.properties]

# Loopback by default; set SERVER_ADDRESS to expose deliberately.
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.docker.compose.enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=${user.home}/.moneytracker/uploads

# Authentication: access tokens issued by Keycloak (OIDC). Tokens must carry
# the API audience (added by the realm's audience mapper).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/miser}
spring.security.oauth2.resourceserver.jwt.audiences=${OIDC_AUDIENCE:miser-api}

# Browser origins allowed to call the API (Flutter web dev server, deployed web app).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5000}

# Statement files: "local" (app.upload-dir) or "s3" (MinIO / Amazon S3).
app.storage.type=${STORAGE_TYPE:local}
app.storage.s3.bucket=${S3_BUCKET:miser-statements}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.storage.s3.create-bucket=${S3_CREATE_BUCKET:false}
app.storage.s3.server-side-encryption=${S3_SSE:true}

management.endpoints.web.exposure.include=health
springdoc.api-docs.path=/v3/api-docs
