# Local development stack. Every port is published on 127.0.0.1 only.
# Secrets come from .env (copy .env.example). Spring Boot starts this file
# automatically on bootRun; or run `docker-compose up -d` yourself.
services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}'
      - 'POSTGRES_USER=myuser'
    ports:
      - '127.0.0.1::5432'

  redis:
    image: 'redis:latest'
    ports:
      - '127.0.0.1::6379'

  # OIDC identity provider: email sign-up/login, GitHub login, password reset.
  keycloak:
    build: ./infra/keycloak
    image: 'miser-keycloak:dev'
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: '${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}'
      KC_HOSTNAME: 'http://localhost:8180'
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - keycloak-data:/opt/keycloak/data
    ports:
      - '127.0.0.1:8180:8080'
    labels:
      org.springframework.boot.ignore: 'true'

  # S3-compatible object storage for statement files (Apache-2.0).
  # Credentials are written to a config file inside the container from .env.
  seaweedfs:
    image: 'chrislusf/seaweedfs:latest'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        umask 077
        printf '{"identities":[{"name":"miser","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256 -volume.max=40
    environment:
      S3_ACCESS_KEY: '${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}'
      S3_SECRET_KEY: '${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}'
    volumes:
      - seaweedfs-data:/data
    ports:
      - '127.0.0.1:8333:8333'
    labels:
      org.springframework.boot.ignore: 'true'

volumes:
  keycloak-data:
  seaweedfs-data:
